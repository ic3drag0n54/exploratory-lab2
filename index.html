<!DOCTYPE html>
<html>

  <head>
    <meta charset="utf-8" />
    <title>Vancouver Development Map</title>
    
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="mapid"></div>

    <!-- The panel with the title, the two buttons and the legend. -->
    <div id="panel">
      <h1>Vancouver Development</h1>
      <p id="subtitle">New building permits per block, 2020–2025. Hover over a block to see details or 
       change between total permits & permits normalized by area to see which areas are developing most intensely.
      </p>

      <button id="countButton" class="active">Permit count</button>
      <button id="densityButton">Permits / hectare</button>

      <!-- count legend-->
      <div id="countLegend">
        <div class="legend-row"><span class="swatch" style="background: #ffffb2;"></span>1</div>
        <div class="legend-row"><span class="swatch" style="background: #fed976;"></span>2</div>
        <div class="legend-row"><span class="swatch" style="background: #feb24c;"></span>3</div>
        <div class="legend-row"><span class="swatch" style="background: #fd8d3c;"></span>4 – 5</div>
        <div class="legend-row"><span class="swatch" style="background: #f03b20;"></span>6 – 8</div>
        <div class="legend-row"><span class="swatch" style="background: #bd0026;"></span>9 or more</div>
      </div>

      <!-- permit/hectare legend-->
      <div id="densityLegend" style="display: none;">
        <div class="legend-row"><span class="swatch" style="background: #ffffb2;"></span>less than 0.5</div>
        <div class="legend-row"><span class="swatch" style="background: #fed976;"></span>0.5 – 1</div>
        <div class="legend-row"><span class="swatch" style="background: #feb24c;"></span>1 – 2</div>
        <div class="legend-row"><span class="swatch" style="background: #fd8d3c;"></span>2 – 3</div>
        <div class="legend-row"><span class="swatch" style="background: #f03b20;"></span>3 – 4</div>
        <div class="legend-row"><span class="swatch" style="background: #bd0026;"></span>4 or more</div>
      </div>

      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
